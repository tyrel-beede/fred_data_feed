# .github/workflows/pull.yml — scheduled data pull for the macro-dials dashboard
name: pull-data

on:
  schedule:
    - cron: "40 22 * * 1-5"   # 22:40 UTC Mon–Fri = 4:40pm ET, after FRED's end-of-day updates
    - cron: "10 13 * * 1-5"   # 13:10 UTC = 7:10am MT, before a morning run
  workflow_dispatch: {}        # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: pull-data
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Pull sources
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python pull.py fred treasury nyfed cftc cftc_disagg prices options breadth eia

      - name: History bridge (FRED series since 2010 that carry the JST concepts; overlap check vs 2016-2020)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python history/tools/bridge_pull.py || echo "bridge pull failed; data pull unaffected"

      - name: Commit changes
        run: |
          git config user.name "macro-dials-bot"
          git config user.email "macro-dials-bot@users.noreply.github.com"
          git pull --rebase -q || true
          git add -A data history/bridge
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data pull $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
